[package]
name = "wordle"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
atty = "0.2"
serde_json = "1.0"
console = "0.15"
colored = "2.0.0"
rand = "0.8.5"
json = "0.12.4"
rayon = "1.7.0"
tui = "0.19.0"
crossterm = "0.26.1"

[dev-dependencies]
lazy_static = "1.4"
assert-json-diff = "2.0"
ntest = "0.9"
pretty_assertions = "1.3"

[[bin]]
name = "extra_version"
path = "src/main+tui+hint.rs"